name: Bug report
description: Something in Odoo is broken or behaves wrongly
title: "[BUG] <module>: <short description>"
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do NOT paste passwords, API keys or customer personal data in this issue.
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - production
        - staging
        - development
    validations:
      required: true
  - type: dropdown
    id: odoo_version
    attributes:
      label: Odoo version
      options:
        - "18.0"
        - "19.0"
        - "20.0"
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Module(s) / app
      placeholder: "e.g. pc_sale_discount, Inventory"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Sales > Orders
        2. Create an order for customer X
        3. Click Confirm
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result (paste the error / traceback)
      render: text
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Impact
      options:
        - "Blocking: users cannot work"
        - "High: workaround exists but painful"
        - "Low: cosmetic / minor"
    validations:
      required: true
